<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Finder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg weather-card p-4">

        <h2 class="text-center mb-4 text-primary">🌤 Weather Finder</h2>

        <div class="input-group mb-3">
            <input type="text" id="city" class="form-control" placeholder="Enter City Name">
            <div class="input-group-append">
                <button class="btn btn-primary" onclick="getWeather()">Search</button>
            </div>
        </div>

        <div id="weatherInfo" class="text-center mt-3"></div>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>

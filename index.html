<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 text-center weather-card">
        <h2 class="mb-4">🌤 Weather Finder</h2>
        <div class="form-group">
            <input type="text" id="city" class="form-control" placeholder="Enter City Name">
        </div>
        <button onclick="getWeather()" class="btn btn-primary btn-block mb-3">
            Get Weather
        </button>
        <div id="weatherInfo" class="mt-3"></div>
    </div>
</div>
<script src="script.js"></script>
</body>

</html>
